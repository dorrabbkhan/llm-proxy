name: Release

# Runs only on a pushed v* tag (the owner's release tag).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Packed-install smoke test (1.1.1 hotfix): the tagged commit must start
  # the way `npx babelgate` does — tarball installed with --omit=dev,
  # NODE_ENV unset. The image is not pushed unless this passes.
  smoke-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/ci/smoke-pack.sh

  docker:
    needs: smoke-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version (tag without leading v)
        id: image
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dorrabbkhan/babelgate:${{ steps.image.outputs.version }}
            ghcr.io/dorrabbkhan/babelgate:latest
