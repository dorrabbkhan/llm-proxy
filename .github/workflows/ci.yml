name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the check when the owner adds or removes
    # the fixtures-approved label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixture guard diffs against origin/main's merge base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/check.sh
        env:
          # Owner-approved fixture/snapshot changes: only the owner applies
          # the fixtures-approved label (agents never do). It skips only the
          # fixture guard; typecheck, tests and build still run.
          ALLOW_FIXTURE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'fixtures-approved') && '1' || '' }}
      - run: docker build .
